<script>
/* theme init before first paint: saved choice, else system preference, else dark */
(function(){try{var t=localStorage.getItem('amandata-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();
</script>

<style>
  .form{max-width:640px}
  .form label{display:block;font-family:var(--micro);font-size:1.2rem;letter-spacing:0.06em;color:var(--dim);margin-bottom:1.2rem}
  .form .hint{color:var(--faint);font-size:1rem}
  .form input[type="email"],.form input[type="password"],.form input[type="text"],.form textarea{display:block;width:100%;margin-top:0.4rem;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;padding:0.7rem 0.9rem}
  .form textarea{resize:vertical}
  .form input:focus,.form textarea:focus{outline:2px solid var(--green);outline-offset:2px;border-color:var(--green)}
  .form button{background:var(--green);color:#0A0C0A;border:none;border-radius:4px;font-family:var(--micro);font-size:1.2rem;letter-spacing:0.06em;padding:0.7rem 1.6rem;cursor:pointer}
  .form button:hover{background:var(--sand)}
  .form button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);padding:0.5rem 1.1rem;font-size:1.05rem}
  .form button.ghost:hover{color:var(--ink);border-color:var(--dim)}
  .form .check{display:flex;align-items:center;gap:0.6rem;cursor:pointer}
  .form .check input{width:1.1rem;height:1.1rem;accent-color:var(--green)}
  .form-error{color:var(--tag);font-family:var(--micro);font-size:1.15rem;letter-spacing:0.04em}
  .form-ok{color:var(--green);font-family:var(--micro);font-size:1.15rem;letter-spacing:0.04em}
  #posts-list{list-style:none;padding:0;margin:0.6rem 0 0}
  #posts-list li{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.6rem 0;border-bottom:1px solid var(--line)}
  #posts-list li span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #posts-list li button{flex:0 0 auto}
  #cancel-edit-btn{margin-left:0.6rem}
</style>

<main>
  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Admin</h2>
      <span class="section__tag">write</span>
    </div>

    <!-- login -->
    <div id="login-view" class="section__body">
      <p class="contact__intro">site owner sign-in.</p>
      <form id="login-form" class="form">
        <label>email<input type="email" id="login-email" required autocomplete="username"></label>
        <label>password<input type="password" id="login-password" required autocomplete="current-password"></label>
        <button type="submit" id="login-btn">Sign in</button>
      </form>
      <p><button id="forgot-btn" class="ghost" type="button">Forgot password?</button></p>
      <form id="forgot-form" class="form" hidden>
        <label>email<input type="email" id="forgot-email" required autocomplete="email"></label>
        <button type="submit">Send reset link</button>
      </form>
      <form id="newpass-form" class="form" hidden>
        <p class="hint">set a new password</p>
        <label>new password<input type="password" id="newpass-1" required minlength="8" autocomplete="new-password"></label>
        <label>repeat it<input type="password" id="newpass-2" required minlength="8" autocomplete="new-password"></label>
        <button type="submit">Save password</button>
      </form>
      <p id="login-msg"></p>
    </div>

    <!-- editor -->
    <div id="editor-view" class="section__body" hidden>
      <form id="post-form" class="form">
        <label>title<input type="text" id="post-title" required maxlength="120" placeholder="A tiny essay on…"></label>
        <label>body <span class="hint">(markdown — # headings, **bold**, *italic*, [links](url))</span><textarea id="post-body" rows="14" required placeholder="Write it here…"></textarea></label>
        <label class="check"><input type="checkbox" id="post-published" checked> Published</label>
        <button type="submit" id="post-submit-btn">Publish post</button>
        <button type="button" id="cancel-edit-btn" class="ghost" hidden>Cancel editing</button>
      </form>
      <p id="post-status"></p>
      <div id="existing-posts">
        <p class="hint">existing posts</p>
        <ul id="posts-list"></ul>
      </div>
      <p><button id="logout-btn" class="ghost form">Sign out</button></p>
    </div>
  </section>
