  sub: '118 terms · tap a card to flip',
  cards: [{"tag": "Ch 1 · Science & method", "term": "Empiricism", "def": "knowledge comes from observation, not authority or gut feeling."}, {"tag": "Ch 1 · Science & method", "term": "Theory", "def": "a broad explanation that organizes facts and predicts new ones."}, {"tag": "Ch 1 · Science & method", "term": "Hypothesis", "def": "a specific, testable prediction derived from a theory."}, {"tag": "Ch 1 · Science & method", "term": "Falsifiable", "def": "stated so precisely that evidence could prove it wrong — required for any scientific claim."}, {"tag": "Ch 1 · Science & method", "term": "Operational definition", "def": "defining a variable by exactly how you measure or manipulate it."}, {"tag": "Ch 1 · Science & method", "term": "Construct", "def": "an abstract idea (like “memory”) you can’t see directly, only measure through operations."}, {"tag": "Ch 1 · Science & method", "term": "Variable", "def": "anything that can take on different values across people or conditions."}, {"tag": "Ch 1 · Science & method", "term": "Basic research", "def": "research done to understand behavior, with no immediate application in mind."}, {"tag": "Ch 1 · Science & method", "term": "Applied research", "def": "research aimed at solving a real-world problem."}, {"tag": "Ch 1 · Science & method", "term": "Replication", "def": "repeating a study to check whether the result holds up."}, {"tag": "Ch 1 · Science & method", "term": "Parsimony", "def": "prefer the simplest explanation that fits the data."}, {"tag": "Ch 1 · Science & method", "term": "Hindsight bias", "def": "after the fact, everything looks obvious — “I knew it all along.”"}, {"tag": "Ch 2 · Ethics", "term": "Informed consent", "def": "participants agree after learning the purpose, procedures, risks, and right to withdraw."}, {"tag": "Ch 2 · Ethics", "term": "Deception", "def": "misleading participants; allowed only when necessary, never about risks."}, {"tag": "Ch 2 · Ethics", "term": "Debriefing", "def": "after the study, explaining what really happened — required whenever deception was used."}, {"tag": "Ch 2 · Ethics", "term": "IRB (Institutional Review Board)", "def": "the committee that must approve human-subjects research in advance."}, {"tag": "Ch 2 · Ethics", "term": "Minimal risk", "def": "harm no greater than what people face in daily life."}, {"tag": "Ch 2 · Ethics", "term": "Risk/benefit ratio", "def": "the IRB’s core calculation — do the potential benefits justify the risks?"}, {"tag": "Ch 2 · Ethics", "term": "Confidentiality", "def": "you can link data to people but promise to keep it private."}, {"tag": "Ch 2 · Ethics", "term": "Anonymity", "def": "data can’t be linked to anyone, not even by you — stronger than confidentiality."}, {"tag": "Ch 2 · Ethics", "term": "Beneficence", "def": "do good and avoid harm (Belmont principle)."}, {"tag": "Ch 2 · Ethics", "term": "Justice", "def": "share research burdens and benefits fairly; don’t exploit vulnerable groups (Belmont principle)."}, {"tag": "Ch 2 · Ethics", "term": "Respect for persons", "def": "people are autonomous agents who decide for themselves (Belmont principle)."}, {"tag": "Ch 2 · Ethics", "term": "3 Rs", "def": "replace, reduce, refine — the guiding principles for ethical animal research."}, {"tag": "Ch 2 · Ethics", "term": "IACUC", "def": "the committee overseeing animal research, like an IRB for animals."}, {"tag": "Ch 2 · Ethics", "term": "CITI training", "def": "the online ethics certification researchers complete before running studies."}, {"tag": "Ch 7 · Experiment basics", "term": "Independent variable (IV)", "def": "the thing the researcher manipulates — the suspected cause."}, {"tag": "Ch 7 · Experiment basics", "term": "Dependent variable (DV)", "def": "the thing measured — the effect."}, {"tag": "Ch 7 · Experiment basics", "term": "Extraneous variable", "def": "anything other than the IV that might influence the DV."}, {"tag": "Ch 7 · Experiment basics", "term": "Confounding variable", "def": "an extraneous variable that varies systematically with the IV, ruining the comparison."}, {"tag": "Ch 7 · Experiment basics", "term": "Internal validity", "def": "confidence that the IV (and not something else) caused the result."}, {"tag": "Ch 7 · Experiment basics", "term": "Random assignment", "def": "placing each participant into conditions by chance — the best defense against confounds."}, {"tag": "Ch 7 · Experiment basics", "term": "Random selection", "def": "picking participants from the population by chance — helps generalizability, not the same as assignment."}, {"tag": "Ch 7 · Experiment basics", "term": "Matching", "def": "pairing participants on a relevant trait, then randomly splitting each pair across conditions."}, {"tag": "Ch 7 · Experiment basics", "term": "Demand characteristics", "def": "cues that tip participants off to the hypothesis, changing their behavior."}, {"tag": "Ch 7 · Experiment basics", "term": "Experimenter expectancy", "def": "the researcher’s expectations unintentionally influencing participants or scoring."}, {"tag": "Ch 7 · Experiment basics", "term": "Single-blind", "def": "participants don’t know which condition they’re in."}, {"tag": "Ch 7 · Experiment basics", "term": "Double-blind", "def": "neither participants nor the people running the study know who’s in which condition."}, {"tag": "Ch 7 · Experiment basics", "term": "Placebo", "def": "an inactive treatment given to the control group, so expectation is held constant."}, {"tag": "Ch 8 · Between-subjects", "term": "Between-subjects design", "def": "each participant goes through only one condition; groups are compared."}, {"tag": "Ch 8 · Between-subjects", "term": "Random assignment", "def": "each participant has an equal chance of landing in any condition."}, {"tag": "Ch 8 · Between-subjects", "term": "Matching", "def": "pairing participants on a relevant variable, then randomly assigning within each pair."}, {"tag": "Ch 8 · Between-subjects", "term": "Block randomization", "def": "randomly assigning equal numbers of participants to each condition, in small blocks."}, {"tag": "Ch 8 · Between-subjects", "term": "Selection threat", "def": "groups differ from the start, so the IV isn’t the only explanation."}, {"tag": "Ch 8 · Between-subjects", "term": "Mortality (attrition)", "def": "participants dropping out; a threat when dropout differs by condition."}, {"tag": "Ch 8 · Between-subjects", "term": "Error variance", "def": "background noise from individual differences that can hide the IV’s effect."}, {"tag": "Ch 8 · Between-subjects", "term": "True experiment", "def": "manipulated IV + random assignment + control/comparison — the only design that nails causality."}, {"tag": "Ch 9 · Basic designs", "term": "Posttest-only design", "def": "random assignment, treatment, then a single measurement — no pretest."}, {"tag": "Ch 9 · Basic designs", "term": "Pretest-posttest design", "def": "measure before and after; the pretest checks equivalence and measures change."}, {"tag": "Ch 9 · Basic designs", "term": "Testing threat", "def": "the pretest itself alters posttest scores (practice, sensitization)."}, {"tag": "Ch 9 · Basic designs", "term": "Solomon four-group design", "def": "combines posttest-only and pretest-posttest groups to isolate pretest effects."}, {"tag": "Ch 9 · Basic designs", "term": "Multiple-group design", "def": "a between-subjects design with one IV at three or more levels."}, {"tag": "Ch 9 · Basic designs", "term": "Experimental group", "def": "the group that receives the IV/treatment."}, {"tag": "Ch 9 · Basic designs", "term": "Control group", "def": "the group that doesn’t get the treatment — the baseline for comparison."}, {"tag": "Ch 9 · Basic designs", "term": "Comparison group", "def": "like a control group, but receives an alternative treatment instead of nothing."}, {"tag": "Ch 10 · Factorial", "term": "Factor", "def": "an independent variable inside a factorial design; each factor has two or more levels."}, {"tag": "Ch 10 · Factorial", "term": "Level", "def": "one version or value of a factor (e.g., low dose vs. high dose)."}, {"tag": "Ch 10 · Factorial", "term": "Cell", "def": "one combination of levels (one box in the design grid)."}, {"tag": "Ch 10 · Factorial", "term": "Factorial design", "def": "a study that tests two or more IVs at the same time, so you can see each one plus how they combine."}, {"tag": "Ch 10 · Factorial", "term": "2 × 2 design", "def": "two factors with two levels each — four cells total."}, {"tag": "Ch 10 · Factorial", "term": "Main effect", "def": "the overall effect of one factor, averaged across the levels of the other factor."}, {"tag": "Ch 10 · Factorial", "term": "Interaction", "def": "when the effect of one factor DEPENDS on the level of the other factor — the graph lines are not parallel."}, {"tag": "Ch 10 · Factorial", "term": "Marginal means", "def": "the averages in the row and column margins; these are what you read for main effects."}, {"tag": "Ch 10 · Factorial", "term": "Simple main effect", "def": "the effect of one factor at just one level of the other factor — how you unpack an interaction."}, {"tag": "Ch 10 · Factorial", "term": "Mixed factorial design", "def": "one factor is between-subjects and the other is within-subjects."}, {"tag": "Ch 11 · Within-subjects", "term": "Within-subjects (repeated-measures) design", "def": "every participant goes through every condition; each person is their own control."}, {"tag": "Ch 11 · Within-subjects", "term": "Participant as own control", "def": "individual differences are held constant because you compare each person against themselves."}, {"tag": "Ch 11 · Within-subjects", "term": "Order effects", "def": "going through one condition changes performance in the next (practice, fatigue, boredom)."}, {"tag": "Ch 11 · Within-subjects", "term": "Practice effects", "def": "getting better at the task from repetition."}, {"tag": "Ch 11 · Within-subjects", "term": "Fatigue effects", "def": "getting worse from tiredness or boredom."}, {"tag": "Ch 11 · Within-subjects", "term": "Carryover effects", "def": "the effect of one condition bleeds into the next (e.g., a drug still in the system)."}, {"tag": "Ch 11 · Within-subjects", "term": "Differential carryover", "def": "carryover that is stronger in one direction — can’t be fixed by counterbalancing."}, {"tag": "Ch 11 · Within-subjects", "term": "Counterbalancing", "def": "shuffling condition order across participants so order effects cancel out."}, {"tag": "Ch 11 · Within-subjects", "term": "Complete counterbalancing", "def": "using every possible order (all 24 orders for 4 conditions) — only practical for small designs."}, {"tag": "Ch 11 · Within-subjects", "term": "Latin square", "def": "each condition appears exactly once in each position, using a smaller set of orders — partial counterbalancing."}, {"tag": "Ch 11 · Within-subjects", "term": "Random order", "def": "a different random sequence per participant; works when there are many conditions."}, {"tag": "Ch 12 · Small-N", "term": "Small-N design", "def": "an experiment run on one participant (or a few), studied intensively over time."}, {"tag": "Ch 12 · Small-N", "term": "Baseline (A phase)", "def": "the “before treatment” period — you just measure the behavior, no IV yet."}, {"tag": "Ch 12 · Small-N", "term": "Treatment (B phase)", "def": "the period where the IV is applied and behavior is measured again."}, {"tag": "Ch 12 · Small-N", "term": "ABAB (reversal) design", "def": "baseline → treatment → back to baseline → treatment again; the return to baseline is what proves the treatment caused the change."}, {"tag": "Ch 12 · Small-N", "term": "Multiple-baseline design", "def": "treatment starts at different times across behaviors, people, or settings — no need to reverse the treatment."}, {"tag": "Ch 12 · Small-N", "term": "Changing-criterion design", "def": "the bar for reinforcement is raised step by step; the behavior should track each new criterion."}, {"tag": "Ch 12 · Small-N", "term": "Stable baseline", "def": "baseline data is steady enough that a later change actually means something."}, {"tag": "Ch 12 · Small-N", "term": "Trend", "def": "baseline data drifting up or down on its own — a threat, because you can’t tell the treatment did it."}, {"tag": "Ch 12 · Small-N", "term": "Visual inspection", "def": "judging graphed data by eye for clear shifts at phase changes, instead of running statistics."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Null hypothesis", "def": "the prediction that the IV has no effect; the thing you test your results against."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Research (alternative) hypothesis", "def": "the prediction that the IV does have an effect — what you actually believe."}, {"tag": "Ch 14 · Conclusions & stats", "term": "p value", "def": "the probability of getting a result this big (or bigger) if the null hypothesis were true."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Alpha level", "def": "your cutoff for calling a result “significant”; usually set at .05."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Type I error", "def": "false alarm — concluding there IS an effect when there really isn’t."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Type II error", "def": "miss — concluding there is NO effect when there really is one."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Statistical power", "def": "the chance your study catches a real effect; bigger samples = more power."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Effect size", "def": "how BIG the effect is, separate from whether it passed the significance cutoff."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Confidence interval", "def": "the range the true population value probably falls inside."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Statistical significance", "def": "the result is unlikely to be due to chance alone (usually p < .05)."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Practical significance", "def": "whether the effect actually matters in real life, not just on paper."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Replication", "def": "rerunning the study to check the result holds up."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Generalization (external validity)", "def": "how far you can stretch your conclusions beyond your own sample and setting."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Nominal scale", "def": "categories with no order (male/female, condition A/B)."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Ordinal scale", "def": "rank order, but gaps aren’t equal (1st, 2nd, 3rd)."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Interval scale", "def": "equal gaps between values, but no true zero (temperature in °F)."}, {"tag": "Ch 14 · Conclusions & stats", "term": "Ratio scale", "def": "equal gaps AND a true zero (reaction time, weight) — you can do ratios with it."}, {"tag": "Ch 15 · Quasi-experiments", "term": "Quasi-experimental design", "def": "has an IV and DV but no random assignment — weaker causal claims."}, {"tag": "Ch 15 · Quasi-experiments", "term": "Nonequivalent groups design", "def": "treatment group compared with a pre-existing, non-randomized control group."}, {"tag": "Ch 15 · Quasi-experiments", "term": "Interrupted time-series design", "def": "many observations before and after an event; looks for a shift at the interruption point."}, {"tag": "Ch 15 · Quasi-experiments", "term": "Selection threat", "def": "pre-existing group differences that rival the IV as an explanation."}, {"tag": "Ch 15 · Quasi-experiments", "term": "History threat", "def": "an outside event coinciding with the IV, offering an alternative explanation."}, {"tag": "Ch 15 · Quasi-experiments", "term": "External validity", "def": "how far results generalize to other people, settings, and times — often quasi-experiments’ strength."}, {"tag": "Ch 15 · Quasi-experiments", "term": "Field experiment", "def": "a true experiment run in a real-world setting — random assignment kept, lab control sacrificed."}, {"tag": "Ch 16 · APA writing", "term": "Abstract", "def": "a 150–250 word summary of the entire study — question, method, results, conclusion."}, {"tag": "Ch 16 · APA writing", "term": "Peer review", "def": "experts vetting a paper before publication — the quality filter of science."}, {"tag": "Ch 16 · APA writing", "term": "Literature review", "def": "a synthesis of existing research that motivates your study."}, {"tag": "Ch 16 · APA writing", "term": "PsycINFO", "def": "psychology’s main article database — where literature searches start."}, {"tag": "Ch 16 · APA writing", "term": "Introduction", "def": "the funnel section — broad background narrowing to your hypothesis."}, {"tag": "Ch 16 · APA writing", "term": "Method section", "def": "participants, materials/apparatus, procedure — the replication recipe."}, {"tag": "Ch 16 · APA writing", "term": "Results section", "def": "what you found, stated plainly with statistics — no interpretation."}, {"tag": "Ch 16 · APA writing", "term": "Discussion section", "def": "what the results mean, limitations, and future directions."}, {"tag": "Ch 16 · APA writing", "term": "References", "def": "the full list of every source cited, in APA format."}]
