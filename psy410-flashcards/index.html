<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PSY 410 Vocab Flashcards</title>
<style>
  :root{ --bg:#FAF6EF; --ink:#3A2A35; --rose:#C96F8E; --rose-d:#A94E70; --cream:#FFFDF8; --line:#E8DCC8; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18px 14px 40px; }
  header{ width:100%; max-width:520px; text-align:center; margin-bottom:10px; }
  .topbar{ width:100%; max-width:520px; margin-bottom:8px; }
  .backbtn{ display:inline-block; font-size:.78rem; font-weight:600; padding:6px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--cream); color:var(--ink); text-decoration:none; }
  .backbtn:active{ transform:scale(.96); }
  h1{ font-size:1.15rem; margin:0 0 2px; letter-spacing:.02em; }
  .sub{ font-size:.8rem; opacity:.65; margin-bottom:10px; }
  .controls{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; width:100%; max-width:520px; }
  select, button{ font-size:.85rem; padding:8px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--cream); color:var(--ink); }
  button{ cursor:pointer; font-weight:600; }
  button:active{ transform:scale(.96); }
  #shuffleBtn{ border-color:var(--rose); color:var(--rose-d); }
  .progress{ width:100%; max-width:520px; margin-bottom:12px; }
  .bar{ height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > div{ height:100%; width:0%; background:linear-gradient(90deg,var(--rose),var(--rose-d)); transition:width .3s; }
  .ptext{ font-size:.78rem; opacity:.7; margin-top:5px; text-align:center; }
  .deck{ width:100%; max-width:520px; perspective:1200px; }
  .card{ position:relative; width:100%; min-height:300px; cursor:pointer; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.7,.3,1.1); }
  .card.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--cream); border:2px solid var(--line); border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; text-align:center; box-shadow:0 6px 20px rgba(169,78,112,.10); }
  .face.back{ transform:rotateY(180deg); background:#FDF3F6; border-color:var(--rose); }
  .tag{ font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:var(--rose-d); margin-bottom:12px; font-weight:700; }
  .term{ font-size:1.6rem; font-weight:700; line-height:1.25; }
  .def{ font-size:1.05rem; line-height:1.5; }
  .hint{ margin-top:14px; font-size:.72rem; opacity:.5; }
  .grade{ display:flex; gap:10px; width:100%; max-width:520px; margin-top:14px; }
  .grade button{ flex:1; padding:13px; font-size:.95rem; border-radius:12px; }
  #missBtn{ background:#FDECEF; border-color:#E8A0B0; color:#A93A55; }
  #gotBtn{ background:#EAF7EE; border-color:#9BD3A8; color:#2E7D43; }
  .done{ text-align:center; padding:40px 20px; }
  .done .big{ font-size:2.4rem; margin-bottom:8px; }
  kbd{ font-size:.7rem; opacity:.5; }
  @media (max-width:420px){ .term{ font-size:1.35rem; } .card{ min-height:270px; } }
</style>
</head>
<body>
<div class="topbar"><a class="backbtn" href="https://amandata.dev/">&#8592; Home</a></div>
<header>
  <h1>PSY 410 &middot; Vocab Flashcards</h1>
  <div class="sub">118 terms &middot; tap a card to flip</div>
</header>
<div class="controls">
  <select id="chFilter"><option value="all">All chapters</option></select>
  <button id="shuffleBtn">&#8635; Shuffle</button>
  <button id="missOnlyBtn">Missed only: off</button>
</div>
<div class="progress"><div class="bar"><div id="barFill"></div></div><div class="ptext" id="ptext"></div></div>
<div class="deck" id="deck"></div>
<div class="grade">
  <button id="missBtn">&#10007; Still learning</button>
  <button id="gotBtn">&#10003; Got it</button>
</div>
<div style="margin-top:10px"><kbd>space = flip &middot; &larr; = still learning &middot; &rarr; = got it</kbd></div>

<script>
const CARDS = [{"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Empiricism", "def": "knowledge comes from observation, not authority or gut feeling."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Theory", "def": "a broad explanation that organizes facts and predicts new ones."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Hypothesis", "def": "a specific, testable prediction derived from a theory."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Falsifiable", "def": "stated so precisely that evidence could prove it wrong \u2014 required for any scientific claim."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Operational definition", "def": "defining a variable by exactly how you measure or manipulate it."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Construct", "def": "an abstract idea (like \u201cmemory\u201d) you can\u2019t see directly, only measure through operations."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Variable", "def": "anything that can take on different values across people or conditions."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Basic research", "def": "research done to understand behavior, with no immediate application in mind."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Applied research", "def": "research aimed at solving a real-world problem."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Replication", "def": "repeating a study to check whether the result holds up."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Parsimony", "def": "prefer the simplest explanation that fits the data."}, {"chapter": "Chapter 1: Experimental Psychology and the Scientific Method", "term": "Hindsight bias", "def": "after the fact, everything looks obvious \u2014 \u201cI knew it all along.\u201d"}, {"chapter": "Chapter 2: Research Ethics", "term": "Informed consent", "def": "participants agree after learning the purpose, procedures, risks, and right to withdraw."}, {"chapter": "Chapter 2: Research Ethics", "term": "Deception", "def": "misleading participants; allowed only when necessary, never about risks."}, {"chapter": "Chapter 2: Research Ethics", "term": "Debriefing", "def": "after the study, explaining what really happened \u2014 required whenever deception was used."}, {"chapter": "Chapter 2: Research Ethics", "term": "IRB (Institutional Review Board)", "def": "the committee that must approve human-subjects research in advance."}, {"chapter": "Chapter 2: Research Ethics", "term": "Minimal risk", "def": "harm no greater than what people face in daily life."}, {"chapter": "Chapter 2: Research Ethics", "term": "Risk/benefit ratio", "def": "the IRB\u2019s core calculation \u2014 do the potential benefits justify the risks?"}, {"chapter": "Chapter 2: Research Ethics", "term": "Confidentiality", "def": "you can link data to people but promise to keep it private."}, {"chapter": "Chapter 2: Research Ethics", "term": "Anonymity", "def": "data can\u2019t be linked to anyone, not even by you \u2014 stronger than confidentiality."}, {"chapter": "Chapter 2: Research Ethics", "term": "Beneficence", "def": "do good and avoid harm (Belmont principle)."}, {"chapter": "Chapter 2: Research Ethics", "term": "Justice", "def": "share research burdens and benefits fairly; don\u2019t exploit vulnerable groups (Belmont principle)."}, {"chapter": "Chapter 2: Research Ethics", "term": "Respect for persons", "def": "people are autonomous agents who decide for themselves (Belmont principle)."}, {"chapter": "Chapter 2: Research Ethics", "term": "3 Rs", "def": "replace, reduce, refine \u2014 the guiding principles for ethical animal research."}, {"chapter": "Chapter 2: Research Ethics", "term": "IACUC", "def": "the committee overseeing animal research, like an IRB for animals."}, {"chapter": "Chapter 2: Research Ethics", "term": "CITI training", "def": "the online ethics certification researchers complete before running studies."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Independent variable (IV)", "def": "the thing the researcher manipulates \u2014 the suspected cause."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Dependent variable (DV)", "def": "the thing measured \u2014 the effect."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Extraneous variable", "def": "anything other than the IV that might influence the DV."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Confounding variable", "def": "an extraneous variable that varies systematically with the IV, ruining the comparison."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Internal validity", "def": "confidence that the IV (and not something else) caused the result."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Random assignment", "def": "placing each participant into conditions by chance \u2014 the best defense against confounds."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Random selection", "def": "picking participants from the population by chance \u2014 helps generalizability, not the same as assignment."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Matching", "def": "pairing participants on a relevant trait, then randomly splitting each pair across conditions."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Demand characteristics", "def": "cues that tip participants off to the hypothesis, changing their behavior."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Experimenter expectancy", "def": "the researcher\u2019s expectations unintentionally influencing participants or scoring."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Single-blind", "def": "participants don\u2019t know which condition they\u2019re in."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Double-blind", "def": "neither participants nor the people running the study know who\u2019s in which condition."}, {"chapter": "Chapter 7: The Basics of Experimentation", "term": "Placebo", "def": "an inactive treatment given to the control group, so expectation is held constant."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Between-subjects design", "def": "each participant goes through only one condition; groups are compared."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Random assignment", "def": "each participant has an equal chance of landing in any condition."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Matching", "def": "pairing participants on a relevant variable, then randomly assigning within each pair."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Block randomization", "def": "randomly assigning equal numbers of participants to each condition, in small blocks."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Selection threat", "def": "groups differ from the start, so the IV isn\u2019t the only explanation."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Mortality (attrition)", "def": "participants dropping out; a threat when dropout differs by condition."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "Error variance", "def": "background noise from individual differences that can hide the IV\u2019s effect."}, {"chapter": "Chapter 8: Between-Subjects Designs", "term": "True experiment", "def": "manipulated IV + random assignment + control/comparison \u2014 the only design that nails causality."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Posttest-only design", "def": "random assignment, treatment, then a single measurement \u2014 no pretest."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Pretest-posttest design", "def": "measure before and after; the pretest checks equivalence and measures change."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Testing threat", "def": "the pretest itself alters posttest scores (practice, sensitization)."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Solomon four-group design", "def": "combines posttest-only and pretest-posttest groups to isolate pretest effects."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Multiple-group design", "def": "a between-subjects design with one IV at three or more levels."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Experimental group", "def": "the group that receives the IV/treatment."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Control group", "def": "the group that doesn\u2019t get the treatment \u2014 the baseline for comparison."}, {"chapter": "Chapter 9: Basic Between-Subjects Designs", "term": "Comparison group", "def": "like a control group, but receives an alternative treatment instead of nothing."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Factor", "def": "an independent variable inside a factorial design; each factor has two or more levels."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Level", "def": "one version or value of a factor (e.g., low dose vs. high dose)."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Cell", "def": "one combination of levels (one box in the design grid)."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Factorial design", "def": "a study that tests two or more IVs at the same time, so you can see each one plus how they combine."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "2 \u00d7 2 design", "def": "two factors with two levels each \u2014 four cells total."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Main effect", "def": "the overall effect of one factor, averaged across the levels of the other factor."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Interaction", "def": "when the effect of one factor DEPENDS on the level of the other factor \u2014 the graph lines are not parallel."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Marginal means", "def": "the averages in the row and column margins; these are what you read for main effects."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Simple main effect", "def": "the effect of one factor at just one level of the other factor \u2014 how you unpack an interaction."}, {"chapter": "Chapter 10: Between-Subjects Factorial Designs", "term": "Mixed factorial design", "def": "one factor is between-subjects and the other is within-subjects."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Within-subjects (repeated-measures) design", "def": "every participant goes through every condition; each person is their own control."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Participant as own control", "def": "individual differences are held constant because you compare each person against themselves."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Order effects", "def": "going through one condition changes performance in the next (practice, fatigue, boredom)."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Practice effects", "def": "getting better at the task from repetition."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Fatigue effects", "def": "getting worse from tiredness or boredom."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Carryover effects", "def": "the effect of one condition bleeds into the next (e.g., a drug still in the system)."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Differential carryover", "def": "carryover that is stronger in one direction \u2014 can\u2019t be fixed by counterbalancing."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Counterbalancing", "def": "shuffling condition order across participants so order effects cancel out."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Complete counterbalancing", "def": "using every possible order (all 24 orders for 4 conditions) \u2014 only practical for small designs."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Latin square", "def": "each condition appears exactly once in each position, using a smaller set of orders \u2014 partial counterbalancing."}, {"chapter": "Chapter 11: Within-Subjects Designs", "term": "Random order", "def": "a different random sequence per participant; works when there are many conditions."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Small-N design", "def": "an experiment run on one participant (or a few), studied intensively over time."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Baseline (A phase)", "def": "the \u201cbefore treatment\u201d period \u2014 you just measure the behavior, no IV yet."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Treatment (B phase)", "def": "the period where the IV is applied and behavior is measured again."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "ABAB (reversal) design", "def": "baseline \u2192 treatment \u2192 back to baseline \u2192 treatment again; the return to baseline is what proves the treatment caused the change."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Multiple-baseline design", "def": "treatment starts at different times across behaviors, people, or settings \u2014 no need to reverse the treatment."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Changing-criterion design", "def": "the bar for reinforcement is raised step by step; the behavior should track each new criterion."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Stable baseline", "def": "baseline data is steady enough that a later change actually means something."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Trend", "def": "baseline data drifting up or down on its own \u2014 a threat, because you can\u2019t tell the treatment did it."}, {"chapter": "Chapter 12: Within-Subjects Designs: Small N", "term": "Visual inspection", "def": "judging graphed data by eye for clear shifts at phase changes, instead of running statistics."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Null hypothesis", "def": "the prediction that the IV has no effect; the thing you test your results against."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Research (alternative) hypothesis", "def": "the prediction that the IV does have an effect \u2014 what you actually believe."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "p value", "def": "the probability of getting a result this big (or bigger) if the null hypothesis were true."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Alpha level", "def": "your cutoff for calling a result \u201csignificant\u201d; usually set at .05."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Type I error", "def": "false alarm \u2014 concluding there IS an effect when there really isn\u2019t."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Type II error", "def": "miss \u2014 concluding there is NO effect when there really is one."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Statistical power", "def": "the chance your study catches a real effect; bigger samples = more power."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Effect size", "def": "how BIG the effect is, separate from whether it passed the significance cutoff."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Confidence interval", "def": "the range the true population value probably falls inside."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Statistical significance", "def": "the result is unlikely to be due to chance alone (usually p < .05)."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Practical significance", "def": "whether the effect actually matters in real life, not just on paper."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Replication", "def": "rerunning the study to check the result holds up."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Generalization (external validity)", "def": "how far you can stretch your conclusions beyond your own sample and setting."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Nominal scale", "def": "categories with no order (male/female, condition A/B)."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Ordinal scale", "def": "rank order, but gaps aren\u2019t equal (1st, 2nd, 3rd)."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Interval scale", "def": "equal gaps between values, but no true zero (temperature in \u00b0F)."}, {"chapter": "Chapter 14: Drawing Conclusions", "term": "Ratio scale", "def": "equal gaps AND a true zero (reaction time, weight) \u2014 you can do ratios with it."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "Quasi-experimental design", "def": "has an IV and DV but no random assignment \u2014 weaker causal claims."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "Nonequivalent groups design", "def": "treatment group compared with a pre-existing, non-randomized control group."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "Interrupted time-series design", "def": "many observations before and after an event; looks for a shift at the interruption point."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "Selection threat", "def": "pre-existing group differences that rival the IV as an explanation."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "History threat", "def": "an outside event coinciding with the IV, offering an alternative explanation."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "External validity", "def": "how far results generalize to other people, settings, and times \u2014 often quasi-experiments\u2019 strength."}, {"chapter": "Chapter 15: Quasi-Experimental Designs", "term": "Field experiment", "def": "a true experiment run in a real-world setting \u2014 random assignment kept, lab control sacrificed."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Abstract", "def": "a 150\u2013250 word summary of the entire study \u2014 question, method, results, conclusion."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Peer review", "def": "experts vetting a paper before publication \u2014 the quality filter of science."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Literature review", "def": "a synthesis of existing research that motivates your study."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "PsycINFO", "def": "psychology\u2019s main article database \u2014 where literature searches start."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Introduction", "def": "the funnel section \u2014 broad background narrowing to your hypothesis."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Method section", "def": "participants, materials/apparatus, procedure \u2014 the replication recipe."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Results section", "def": "what you found, stated plainly with statistics \u2014 no interpretation."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "Discussion section", "def": "what the results mean, limitations, and future directions."}, {"chapter": "Chapter 16: Communicating Research: APA Style Manuscripts", "term": "References", "def": "the full list of every source cited, in APA format."}];
const chapters = [...new Set(CARDS.map(c=>c.chapter))];
const sel = document.getElementById('chFilter');
chapters.forEach(ch=>{ const o=document.createElement('option'); o.value=ch; o.textContent=ch.replace('Chapter ','Ch '); sel.appendChild(o); });

let queue=[], idx=0, got=new Set(), missed=new Set(), missOnly=false, flipped=false;

function buildQueue(){
  let pool = CARDS.map((c,i)=>i);
  const f = sel.value;
  if(f!=='all') pool = pool.filter(i=>CARDS[i].chapter===f);
  if(missOnly) pool = pool.filter(i=>missed.has(i));
  queue = pool; idx=0;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function render(){
  const deck = document.getElementById('deck');
  if(idx>=queue.length){ showDone(deck); return; }
  const c = CARDS[queue[idx]];
  flipped=false;
  deck.innerHTML =
    '<div class="card" id="card"><div class="face front"><div class="tag">'+esc(c.chapter)+'</div>'+
    '<div class="term">'+esc(c.term)+'</div><div class="hint">tap to flip</div></div>'+
    '<div class="face back"><div class="tag">'+esc(c.chapter)+'</div>'+
    '<div class="def">'+esc(c.def)+'</div><div class="hint">tap to flip back</div></div></div>';
  document.getElementById('card').addEventListener('click', flip);
  updateProgress();
}
function flip(){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped', flipped); }
function updateProgress(){
  const total = queue.length;
  document.getElementById('barFill').style.width = total? (idx/total*100)+'%' : '0%';
  document.getElementById('ptext').textContent = total? ('card '+(Math.min(idx+1,total))+' of '+total+'  ·  '+got.size+' nailed  ·  '+missed.size+' to review') : 'no cards in this view';
}
function showDone(deck){
  updateProgress();
  deck.innerHTML = '<div class="face done" style="position:static"><div class="big">🎉</div>'+
    '<div class="term">Deck complete!</div><div class="hint">'+got.size+' nailed · '+missed.size+' still learning<br><br>reshuffle or switch chapters to keep drilling</div></div>';
}
function grade(known){
  if(idx>=queue.length) return;
  const i = queue[idx];
  if(known){ got.add(i); missed.delete(i); } else { missed.add(i); got.delete(i); }
  idx++; render();
}
document.getElementById('gotBtn').addEventListener('click', ()=>grade(true));
document.getElementById('missBtn').addEventListener('click', ()=>grade(false));
document.getElementById('shuffleBtn').addEventListener('click', ()=>{ buildQueue(); shuffle(queue); idx=0; got=new Set(); missed=new Set(); render(); });
document.getElementById('missOnlyBtn').addEventListener('click', function(){ missOnly=!missOnly; this.textContent='Missed only: '+(missOnly?'on':'off'); buildQueue(); idx=0; render(); });
sel.addEventListener('change', ()=>{ buildQueue(); idx=0; render(); });
document.addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault(); const c=document.getElementById('card'); if(c) flip(); }
  if(e.key==='ArrowRight') grade(true);
  if(e.key==='ArrowLeft') grade(false);
});
buildQueue(); shuffle(queue); render();
</script>
</body>
</html>
